<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Thread | YouMatter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="forums.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <section class="sub-header">
    <nav>
      <a href="index.html"><img src="images/logo.png" alt=""></a>
      <div class="nav-links" id="navLinks">
        <i class="fa fa-times" onclick="hideMenu()"></i>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="forums.html" aria-current="page">FORUMS</a></li>
        </ul>
      </div>
      <i class="fa fa-bars" onclick="showMenu()"></i>
    </nav>
    <h1 id="threadTitle">Forum Thread</h1>
  </section>

  <section class="content-section">
    <div class="content-container">
      <div class="thread-header">
        <a href="forums.html" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back to Forums</span>
        </a>
        <p id="threadSub" class="thread-sub"></p>
      </div>

      <div class="thread-shell">
        <div class="thread-intro">
          <h2 id="forumTitleInline" class="thread-inline-title"></h2>
          <p id="forumDescInline" class="thread-inline-desc"></p>
          <div id="forumMeta" class="message-meta"></div>
        </div>

        <label for="author-name" class="post-form-label">Your name (optional):</label>
        <input id="author-name" class="input" type="text" placeholder="e.g., Skyfall" />

        <label for="post-text" class="post-form-label">Your reply:</label>
        <textarea id="post-text" class="textarea" placeholder="Write your reply..."></textarea>
        <div class="post-actions">
          <button id="post-btn" type="button">Reply</button>
        </div>

        <div id="postStatus" style="margin-top:10px; font-weight:600;"></div>

        <div id="posts" class="messages-list">
          <p class="message-empty">No posts yet. Your post will appear here after you share.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="footer">
    <h4>About Us</h4>
    <p>Built with purpose.</p>
    <div class="icons">
      <i class="fab fa-facebook-f"></i>
      <i class="fab fa-twitter"></i>
      <i class="fab fa-instagram"></i>
      <i class="fab fa-linkedin-in"></i>
    </div>
    <p>MADE WITH <i class="fa-regular fa-heart"></i> BY THE YOU MATTER TEAM</p>
  </section>

  <script src="menu.js"></script>
  <script type="module">
    import { db, ensureAnonAuth, serverTimestamp, friendlyFirebaseError } from "./firebase-client.js";
    import { collection, doc, addDoc, query, orderBy, onSnapshot, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const forumId = params.get('forumId');

    const titleEl = document.getElementById('threadTitle');
    const subEl = document.getElementById('threadSub');
    const metaEl = document.getElementById('forumMeta');
    const titleInlineEl = document.getElementById('forumTitleInline');
    const descInlineEl = document.getElementById('forumDescInline');

    const postBtn = document.getElementById('post-btn');
    const postText = document.getElementById('post-text');
    const authorNameEl = document.getElementById('author-name');
    const postsDiv = document.getElementById('posts');
    const statusEl = document.getElementById('postStatus');

    function setStatus(text, ok=false) {
      if (!statusEl) return;
      statusEl.textContent = text;
      statusEl.style.color = ok ? "#166534" : "#b91c1c";
    }

    function fmtDate(ts){
      try {
        return ts?.toDate?.() ? ts.toDate().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
      } catch { return ''; }
    }
    async function loadForumHeader(){
      if (!forumId){ titleEl.textContent = "Forum Thread"; subEl.textContent = ""; metaEl.textContent = ""; return; }
      const forumRef = doc(db, "forums", forumId);
      const snap = await getDoc(forumRef);
      const d = snap.exists() ? snap.data() : null;
      titleEl.textContent = d?.title || "Forum Thread";
      subEl.textContent = d?.description || "";
      titleInlineEl.textContent = d?.title || "";
      descInlineEl.textContent = d?.description || "";
      const who = d?.authorName || 'Anonymous';
      const when = fmtDate(d?.createdAt) || '';
      metaEl.textContent = `Posted by ${who}${when ? ' · ' + when : ''}`;
    }

    async function createReply(text, displayName){
      const repliesRef = collection(db, "forums", forumId, "replies");
      await addDoc(repliesRef, {
        text,
        authorName: displayName,
        createdAt: serverTimestamp()
      });
      const forumRef = doc(db, "forums", forumId);
      await updateDoc(forumRef, {
        replyCount: increment(1),
        latestLabel: "Just now",
        lastActivityAt: serverTimestamp(),
      });
    }

    function renderReply(docSnap){
      const d = docSnap.data();
      const text = d.text ?? "";
      const name = d.authorName || "Anonymous";
      const el = document.createElement('div');
      el.className = 'message-card';
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = (name || 'A').charAt(0).toUpperCase();
      const body = document.createElement('div'); body.className = 'message-body';
      const meta = document.createElement('div'); meta.className = 'message-meta';
      let timeStr = 'Just now';
      if (d.createdAt && d.createdAt.toDate) {
        timeStr = d.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      meta.textContent = `${name} · ${timeStr}`;
      const msgText = document.createElement('div'); msgText.className = 'message-text'; msgText.textContent = text;
      body.appendChild(meta); body.appendChild(msgText);
      el.appendChild(avatar); el.appendChild(body);
      postsDiv.appendChild(el);
    }

    function listenForReplies(){
      const q = query(collection(db, 'forums', forumId, 'replies'), orderBy('createdAt', 'asc'));
      onSnapshot(q, (snap) => {
        postsDiv.innerHTML = '';
        if (snap.empty) {
          postsDiv.innerHTML = '<p class="message-empty">No replies yet. Your reply will appear here after you share.</p>';
          return;
        }
        snap.forEach((docSnap) => { renderReply(docSnap); });
      });
    }

    postBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      setStatus("Posting...", true);
      const val = postText.value.trim();
      if (!val) { setStatus("Please write something before posting."); return; }
      const displayName = authorNameEl.value.trim() || 'Anonymous';
      postBtn.disabled = true;
      try {
        await ensureAnonAuth();
        await createReply(val, displayName);
        postText.value = '';
        postText.focus();
        setStatus("Posted!", true);
      } catch (err) {
        console.error('Error posting reply:', err);
        setStatus(friendlyFirebaseError(err));
      } finally {
        postBtn.disabled = false;
      }
    });

    (async function(){
      await ensureAnonAuth();
      await loadForumHeader();
      if (forumId) listenForReplies();
    })();
  </script>
</body>
</html>
