  <script>
  const searchEl = document.getElementById("forumSearch");
  const catEl = document.getElementById("forumCategory");
  const list = document.getElementById("topicList");
  const noResults = document.getElementById("noResults");
  const tabs = document.querySelectorAll(".wpTab");

  let activeTab = "all";

  function applyFilter(){
    const q = (searchEl.value || "").trim().toLowerCase();
    const cat = (catEl.value || "all").toLowerCase();
    const rows = Array.from(document.querySelectorAll(".wpRow"));
    let shown = 0;

    rows.forEach(row => {
      const title = (row.dataset.title || "").toLowerCase();
      const desc  = (row.dataset.desc || "").toLowerCase();
      const tags  = (row.dataset.tags || "").toLowerCase();
      const rcat  = (row.dataset.category || "all").toLowerCase();
      const replies = parseInt(row.dataset.replies || "0", 10);

      const matchQuery = !q || (title + " " + desc + " " + tags).includes(q);
      const matchCat = (cat === "all") || (rcat === cat);

      let matchTab = true;
      if (activeTab === "open") matchTab = replies === 0;
      if (activeTab === "popular") matchTab = replies >= 5;

      const show = matchQuery && matchCat && matchTab;
      row.style.display = show ? "" : "none";
      if (show) shown++;
    });

    noResults.style.display = shown ? "none" : "block";
  }

  searchEl.addEventListener("input", applyFilter);
  catEl.addEventListener("change", applyFilter);

  tabs.forEach(t => {
    t.addEventListener("click", () => {
      if (t.dataset.tab === 'add') {
        // Modal opens via separate script; do not toggle filters
        return;
      }
      tabs.forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      activeTab = t.dataset.tab;
      applyFilter();
    });
  });

  applyFilter();
  </script>

  <script type="module">
    import { db, ensureAnonAuth, serverTimestamp, friendlyFirebaseError } from "./firebase-client.js";
    import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const THREAD_ID = {
      introduce: 'introduce-yourself',
      anxiety: 'anxiety-stress',
      depression: 'depression',
      selfcare: 'self-care',
      wins: 'wins'
    };

    const modal = document.getElementById('postModal');
    const btnOpen = document.querySelector('.wpAddBtn');
    const btnClose = document.getElementById('postModalClose');
    const btnSubmit = document.getElementById('postModalSubmit');
    const authorEl = document.getElementById('modalAuthor');
    const textEl = document.getElementById('modalText');
    const titleEl = document.getElementById('modalTitle');
    const statusEl = document.getElementById('postModalStatus');

    function setStatus(msg, ok=false){
      statusEl.textContent = msg;
      statusEl.style.color = ok ? '#166534' : '#b91c1c';
    }

    function openModal(){ modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); }
    function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); setStatus(''); }

    btnOpen?.addEventListener('click', () => openModal());
    btnClose?.addEventListener('click', () => closeModal());
    modal.addEventListener('click', (e) => { if (e.target && e.target.dataset && e.target.dataset.close) closeModal(); });

    // Helper: tiny HTML escape
    function escapeHtml(str){
      return String(str || '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    // Submit new forum topic (top-level post)
    btnSubmit?.addEventListener('click', async () => {
      const text = (textEl.value || '').trim();
      const title = (titleEl?.value || '').trim();
      const name = (authorEl.value || '').trim() || 'Anonymous';
      if (!text && !title) { setStatus('Please write something before posting.'); return; }
      const combined = title ? `${title}\n\n${text}` : text;
      btnSubmit.disabled = true;
      setStatus('Posting...', true);
      try {
        await ensureAnonAuth();
        // Create a new post inside the Depression thread (matches existing rules)
        await addDoc(collection(db, 'threads', 'depression', 'posts'), {
          text: combined,
          authorName: name,
          createdAt: serverTimestamp()
        });
        if (titleEl) titleEl.value = '';
        textEl.value = '';
        setStatus('Posted! Your message appears in Depression.', true);
        closeModal();
      } catch (e) {
        console.error('Post failed:', e);
        setStatus(friendlyFirebaseError(e));
      } finally {
        btnSubmit.disabled = false;
      }
    });

    // Render dynamic forum posts into #topicDynamic
    const dynamicEl = document.getElementById('topicDynamic');
    function renderRow(docSnap){
      const d = docSnap.data() || {};
      const id = docSnap.id;
      const desc = (d.text || '').trim();
      const preview = desc.length > 140 ? (desc.slice(0,140) + '…') : desc;
      let latest = 'Today';
      try {
        if (d.createdAt && d.createdAt.toDate) {
          latest = d.createdAt.toDate().toLocaleDateString();
        }
      } catch {}
      const a = document.createElement('a');
      a.className = 'wpRow';
      a.href = `thread-depression.html`;
      a.setAttribute('data-title', 'Depression');
      a.setAttribute('data-desc', preview);
      a.setAttribute('data-tags', 'depression');
      a.setAttribute('data-category', 'depression');
      a.setAttribute('data-replies', '0');
      a.innerHTML = `
        <div class="wpTopic">
          <div class="wpTopicTitle">Depression</div>
          <div class="wpTopicDesc">${escapeHtml(preview)}</div>
        </div>
        <div class="wpReplies" data-id="${id}">0</div>
        <div class="wpLatest">${escapeHtml(latest)}</div>
      `;
      dynamicEl.appendChild(a);

      // Live replies count for this Depression post
      const repliesCell = a.querySelector('.wpReplies');
      try {
        const rq = query(collection(db, 'threads', 'depression', 'posts', id, 'replies'), orderBy('createdAt','asc'));
        onSnapshot(rq, (snap) => {
          repliesCell.textContent = String(snap.size);
          a.setAttribute('data-replies', String(snap.size));
        });
      } catch {}
    }

    // Listen for new posts in Depression and render
    const q = query(collection(db, 'threads', 'depression', 'posts'), orderBy('createdAt','desc'));
    onSnapshot(q, (snap) => {
      dynamicEl.innerHTML = '';
      snap.forEach(docSnap => renderRow(docSnap));
    });
  </script>
